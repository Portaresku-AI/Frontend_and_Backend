<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои проекты | Frontend</title>
    <style>
        /* Базовые сбросы стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Красивый градиентный фон на всю высоту экрана */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* Карточка по центру */
        .container {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        p {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        /* Контейнер для кнопок */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Общие стили для кнопок */
        .btn {
            display: inline-block;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        /* Зеленая кнопка для Практики */
        .btn-practice {
            background-color: #2ecc71;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2);
        }

        .btn-practice:hover {
            background-color: #27ae60;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(46, 204, 113, 0.3);
        }

        /* Красная кнопка для Контрольной */
        .btn-control {
            background-color: #e74c3c;
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.2);
        }

        .btn-control:hover {
            background-color: #c0392b;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(231, 76, 60, 0.3);
        }

        /* Эффект нажатия */
        .btn:active {
            transform: translateY(1px);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Мои учебные проекты</h1>
        <h2>Frontend and Backend</h2>
        <p>Выберите работу для просмотра</p>

        <div class="buttons-container">
            <!-- Ссылка на Практику -->
            <a href="Practice-N1-140926/kr1-html-css-shop/index.html" class="btn btn-practice">
                Практика №1
            </a>

            <!-- Ссылка на Контрольную работу -->
            <a href="ControlWork-N1-051026/kr1-html-css-shop/index.html" class="btn btn-control">
                Контрольная работа №1
            </a>

        </div>
    </div>

</body>

</html>
